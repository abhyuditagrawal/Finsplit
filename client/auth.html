<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSplit - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 2rem;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 10px;
            background: #f8f9ff;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .auth-tab.active {
            background: #667eea;
            color: white;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #48bb78;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">💰 FinSplit</div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Login</div>
            <div class="auth-tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
  <label>Password</label>
  <input type="password" id="loginPassword" required />
</div>
<!-- ADD THIS -->
<div style="text-align: right; margin: 10px 0;">
  <a href="#" onclick="openForgotPasswordModal()" style="color: #667eea; font-size: 14px; text-decoration: none;">
    Forgot Password?
  </a>
</div>

            <button type="submit" class="btn" id="loginBtn">Login</button>
            <div id="loginError" class="error-message"></div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="registerName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" required minlength="6">
            </div>
            <div class="form-group">
                <label>UPI ID</label>
                <input type="text" id="registerUpiId" required placeholder="yourname@paytm">
            </div>
            <div class="form-group">
                <label>Phone Number (Optional)</label>
                <input type="tel" id="registerPhone">
            </div>
            <button type="submit" class="btn" id="registerBtn">Register</button>
            <div id="registerError" class="error-message"></div>
            <div id="registerSuccess" class="success-message"></div>
        </form>
    </div>

    <!-- ADD THE FORGOT PASSWORD MODAL HERE -->
<div id="forgotPasswordModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 1000;">
  <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
    <div style="background: white; border-radius: 12px; padding: 2rem; max-width: 400px; width: 90%;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3>🔐 Reset Password</h3>
        <button onclick="closeForgotPasswordModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #718096;">&times;</button>
      </div>
      
      <form onsubmit="forgotPassword(event)">
        <div class="form-group">
          <label>Enter your email address:</label>
          <input type="email" id="forgotPasswordEmail" required />
          <p style="font-size: 12px; color: #718096; margin-top: 5px;">
            We'll send you a link to reset your password.
          </p>
        </div>
        
        <button type="submit" class="btn" id="forgotPasswordBtn">Send Reset Link</button>
      </form>
      
      <div id="forgotPasswordError" class="error-message"></div>
      <div id="forgotPasswordSuccess" class="success-message"></div>
    </div>
  </div>
</div>

  </body>
</html>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Switch between login and register tabs
        function switchTab(tab) {
            // Update tab styling
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            
            // Clear error messages
            clearMessages();
        }

        function clearMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(msg => {
                msg.style.display = 'none';
                msg.textContent = '';
            });
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store token and user data
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    // Redirect to main app
                    window.location.href = 'index.html';
                } else {
                    showError('loginError', data.message);
                }
            } catch (error) {
                showError('loginError', 'Network error. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';
            
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: document.getElementById('registerName').value,
                        email: document.getElementById('registerEmail').value,
                        password: document.getElementById('registerPassword').value,
                        upiId: document.getElementById('registerUpiId').value,
                        phone: document.getElementById('registerPhone').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('registerSuccess', 'Account created successfully! Please login.');
                    
                    // Clear form
                    document.getElementById('registerForm').reset();
                    
                    // Switch to login tab after 2 seconds
                    setTimeout(() => {
                        switchTab('login');
                    }, 2000);
                } else {
                    showError('registerError', data.message);
                }
            } catch (error) {
                showError('registerError', 'Network error. Please try again.');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        });

        // Check if user is already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

// Forgot password functionality
function openForgotPasswordModal() {
  document.getElementById('forgotPasswordModal').style.display = 'flex';
  document.getElementById('forgotPasswordEmail').value = '';
  document.getElementById('forgotPasswordError').style.display = 'none';
  document.getElementById('forgotPasswordSuccess').style.display = 'none';
}

function closeForgotPasswordModal() {
  document.getElementById('forgotPasswordModal').style.display = 'none';
}

async function forgotPassword(event) {
  event.preventDefault();
  
  const btn = document.getElementById('forgotPasswordBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  
  const errorDiv = document.getElementById('forgotPasswordError');
  const successDiv = document.getElementById('forgotPasswordSuccess');
  
  errorDiv.style.display = 'none';
  successDiv.style.display = 'none';
  
  try {
    const response = await fetch(`${API_BASE}/profile/forgot-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: document.getElementById('forgotPasswordEmail').value
      })
    });
    
    const data = await response.json();
    
    if (data.success) {
      successDiv.textContent = data.message;
      successDiv.style.display = 'block';
      
      // Show reset token in development
      if (data.resetToken) {
        successDiv.innerHTML = data.message + '<br><br><strong>Development Mode:</strong><br>Reset Token: ' + data.resetToken + '<br><small>Use this token to reset your password</small>';
      }
    } else {
      errorDiv.textContent = data.message;
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'Network error. Please try again.';
    errorDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
}
</script>

</body>
</html>
